aid: 6thsense
name: 6thSense
description: 6thSense is a physical-AI hardware company building the touch layer for dexterous
  robots. It designs and manufactures wearable tactile-sensing data gloves that capture how human
  hands interact with the world — pressure, contact, grip, and 3D hand pose — alongside custom
  tactile skin molded to robot hands. Its capture stack synchronizes eight aligned modalities
  (tactile and pressure proxies, egocentric video, depth/RGB-D, hand pose, motion and IMU dynamics,
  wrist and scene cameras, dense labels and commentary, and success/failure outcomes) into
  model-ready demonstration datasets used to train the next generation of dexterous,
  manipulation-capable robots. Founded in 2026 in San Francisco and backed by Y Combinator (S26).
